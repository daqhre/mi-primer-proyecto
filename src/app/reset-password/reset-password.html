<div class="auth-page">
  <div class="auth-card card reset-card">
    <h2>Cambiar Contraseña</h2>
    <p class="form-text">Ingresa y confirma tu nueva contraseña.</p>

    <form (ngSubmit)="cambiarPassword()" *ngIf="!mensajeExitoso && token">
      <div class="form-group">
        <label for="newPassword">Nueva Contraseña</label>
        <input type="password" id="newPassword" [(ngModel)]="newPassword" name="newPassword" required (input)="onPasswordChange()">
      </div>

      <div class="form-group">
        <label for="confirmPassword">Confirmar Nueva Contraseña</label>
        <input type="password" id="confirmPassword" [(ngModel)]="confirmPassword" name="confirmPassword" required>
      </div>

      <div *ngIf="mensajePassword" class="mensaje-password-error">
        {{ mensajePassword }}
      </div>

      <div *ngIf="newPassword.length > 0 && !mensajePassword" class="password-strength-bar-container">
        <div class="password-strength-bar" [style.width.%]="getPasswordStrength().percentage" [style.backgroundColor]="getPasswordStrength().color"></div>
        <span>Fortaleza: {{ getPasswordStrength().level }}</span>
      </div>

      <button type="submit" class="btn btn-primary btn-block" [disabled]="!newPassword || !confirmPassword">Cambiar Contraseña</button>
    </form>

    <div *ngIf="mensaje" class="mensaje-final" [class.error]="mensaje.startsWith('Error')" [class.success]="mensajeExitoso">
      <p>{{ mensaje }}</p>
      <a *ngIf="mensajeExitoso" routerLink="/login">Ir a Iniciar Sesión</a>
      <a *ngIf="!mensajeExitoso && !token" routerLink="/login">Volver a Inicio</a>
    </div>
  </div>
</div>
